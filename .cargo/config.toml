[env]
SDKROOT = { value = "/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk", force = false }
LIBCLANG_PATH = { value = "/Library/Developer/CommandLineTools/usr/lib", force = false }
BINDGEN_EXTRA_CLANG_ARGS = { value = "--sysroot=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk -isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk -isystem /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include", force = false }
CC_aarch64_apple_darwin = { value = "/Library/Developer/CommandLineTools/usr/bin/clang", force = false }
CXX_aarch64_apple_darwin = { value = "/Library/Developer/CommandLineTools/usr/bin/clang++", force = false }
