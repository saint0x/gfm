[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/config",
    "crates/content",
    "crates/fs",
    "crates/index",
    "crates/jobs",
    "crates/mac",
    "crates/ops",
    "crates/packaging",
    "crates/search",
    "crates/store",
    "crates/testkit",
    "crates/telemetry",
    "crates/types",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"
